name: Build SuSa studio APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -s debug.keystore.base64 ] && base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null; then
            echo "Decoded debug.keystore from debug.keystore.base64"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuSa-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk "$APK_PATH#SuSa-studio-debug.apk" --clobber
          else
            gh release create latest-apk "$APK_PATH#SuSa-studio-debug.apk" \
              --title "SuSa studio Latest APK" \
              --notes "Automated debug APK build from commit ${GITHUB_SHA::7}."
          fi
