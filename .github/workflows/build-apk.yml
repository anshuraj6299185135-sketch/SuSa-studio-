name: Build SuSa studio APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -s debug.keystore.base64 ] && base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null; then
            echo "Decoded debug.keystore from debug.keystore.base64"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '"project_info"'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ ! -f app/google-services.json ]; then
            mkdir -p app
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "927317865715",
    "project_id": "gen-lang-client-0546974834",
    "storage_bucket": "gen-lang-client-0546974834.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:927317865715:android:41d851a7649ee06735f386",
        "android_client_info": {
          "package_name": "com.aistudio.susastudio.kxvmqr"
        }
      },
      "oauth_client": [
        {
          "client_id": "927317865715-6o8h2vmq70kvc6cmf2mscfvo78ar38ha.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.aistudio.susastudio.kxvmqr",
            "certificate_hash": "93b34fc65e020317ea4e977d57044ecc9daf6c83"
          }
        },
        {
          "client_id": "927317865715-of9o2co56l255qvjtag1h5ko0atn187s.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyAbwCwYBcjRSyc26gCwtOPGw0Q0r7OLp0Y"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "927317865715-of9o2co56l255qvjtag1h5ko0atn187s.apps.googleusercontent.com",
              "client_type": 3
            }
          }
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
            echo "Auto-generated default app/google-services.json for SuSa studio."
          fi

      - name: Build Debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuSa-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk "$APK_PATH#SuSa-studio-debug.apk" --clobber
          else
            gh release create latest-apk "$APK_PATH#SuSa-studio-debug.apk" \
              --title "SuSa studio Latest APK" \
              --notes "Automated debug APK build from commit ${GITHUB_SHA::7}."
          fi
